name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # 这些插件的 peerDependencies 指向 DSH 宿主包（未公开发布），
      # 必须 --legacy-peer-deps 才能解析；构建（tsc 引宿主类型）在本地 DSH 环境做，不进 CI。
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck (non-blocking; needs DSH host types)
        run: npm run typecheck
        continue-on-error: true
      - name: Run tests
        run: npm test
